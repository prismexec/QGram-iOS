name: Build QGram unsigned IPA

# Ручной запуск из вкладки Actions на GitHub (кнопка "Run workflow").
# Требуется runner "macos-latest" (GitHub предоставляет его бесплатно с лимитом минут
# для приватных репо, для публичных — без лимита, но macOS-минуты в 10 раз "дороже"
# обычных в подсчёте квоты).
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-14   # Apple Silicon runner; Telegram-iOS требует свежий Xcode (см. versions.json репозитория)
    timeout-minutes: 360  # сборка Telegram-iOS через Bazel занимает 1.5-3 часа на чистом кеше

    steps:
      - name: Checkout QGram-iOS (форк Telegram-iOS)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode version
        run: |
          # Версия должна совпадать с той, что указана в build-system/Make/versions.json форка.
          # Проверь актуальную версию перед запуском: cat versions.json
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r build-system/Make/requirements.txt || true

      - name: Restore Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-cache-${{ runner.os }}-${{ hashFiles('versions.json') }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-

      - name: Write build configuration (без кодсайнинга — для симулятора/дженерик архива)
        env:
          API_ID: ${{ secrets.TG_API_ID }}
          API_HASH: ${{ secrets.TG_API_HASH }}
          BUNDLE_ID: ${{ secrets.QGRAM_BUNDLE_ID }}
        run: |
          cat > build-system/qgram_configuration.json <<EOF
          {
            "bundle_id": "${BUNDLE_ID}",
            "api_id": "${API_ID}",
            "api_hash": "${API_HASH}",
            "team_id": "${{ secrets.APPLE_TEAM_ID }}",
            "app_center_id": "0",
            "is_internal_build": "true",
            "is_appstore_build": "false",
            "appstore_id": "0",
            "app_specific_url_scheme": "qgram",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF

      - name: Decode signing certificate & provisioning profile
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p build-system/codesigning/certs/development
          mkdir -p build-system/codesigning/profiles/development
          echo "$CERT_P12_BASE64" | base64 --decode > build-system/codesigning/certs/development/cert.p12
          echo "$PROFILE_BASE64" | base64 --decode > build-system/codesigning/profiles/development/Telegram.mobileprovision

      - name: Generate Xcode project (Bazel)
        run: |
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            generateProject \
            --configurationPath=build-system/qgram_configuration.json \
            --codesigningInformationPath=build-system/codesigning

      - name: Build IPA (release_arm64)
        run: |
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/qgram_configuration.json \
            --codesigningInformationPath=build-system/codesigning \
            --buildNumber=${{ github.run_number }} \
            --configuration=release_arm64

      - name: Locate build output
        run: |
          find . -iname "*.ipa" -maxdepth 6

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QGram-ipa
          path: |
            **/*.ipa
          retention-days: 14
