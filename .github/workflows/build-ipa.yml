name: Build PrismGram IPA

# PrismGram = Swiftgram (open-source Telegram iOS fork) + AyuGram-style features.
# The workflow downloads Swiftgram at the commit pinned in prismgram/upstream.json,
# applies prismgram/patches + branding, and builds an unsigned (fake-signed) IPA.
# Install the IPA with Sideloadly / AltStore / TrollStore, which re-sign it.

on:
  workflow_dispatch:
    inputs:
      post_build:
        description: "Only post this already published build (e.g. 3754) to the Telegram channel"
        required: false
        default: ""
  push:
    branches: [ "main", "claude/**" ]
    paths:
      - "prismgram/**"
      - ".github/workflows/build-ipa.yml"

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Cheap Linux job: patches must apply and patched Swift files must parse.
    if: ${{ !inputs.post_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PrismGram kit
        uses: actions/checkout@v4

      - name: Apply patches to Swiftgram
        run: |
          set -e
          REPO=$(python3 -c 'import json;print(json.load(open("prismgram/upstream.json"))["repository"])')
          COMMIT=$(python3 -c 'import json;print(json.load(open("prismgram/upstream.json"))["commit"])')
          mkdir -p /tmp/sg && cd /tmp/sg
          git init -q && git remote add origin "$REPO"
          git fetch -q --depth 1 origin "$COMMIT" && git checkout -q FETCH_HEAD
          python3 "$GITHUB_WORKSPACE/prismgram/apply_prismgram.py" /tmp/sg

      - name: Check Swift syntax of patched files
        run: |
          set -e
          python3 -m pip install -q tree-sitter tree-sitter-swift
          cd /tmp/sg
          FILES=$(cat "$GITHUB_WORKSPACE"/prismgram/patches/*.patch | sed -n 's|^+++ b/\(.*\.swift\)$|\1|p' | sort -u)
          # AccountStateManagementUtils.swift has a stray ';' that this parser rejects upstream too.
          FILES=$(echo "$FILES" | grep -v 'AccountStateManagementUtils.swift' || true)
          python3 "$GITHUB_WORKSPACE/prismgram/check_swift_syntax.py" $FILES

  build:
    needs: check
    runs-on: macos-26
    permissions:
      contents: write
    timeout-minutes: 355
    # TG_API_ID / TG_API_HASH are stored as secrets of the "P" environment.
    environment: P
    outputs:
      build_number: ${{ steps.build.outputs.build_number }}

    env:
      SRC_DIR: /Users/Shared/prismgram-src
      BAZEL_CACHE_DIR: /Users/runner/bazel-cache

    steps:
      - name: Checkout PrismGram kit
        uses: actions/checkout@v4

      - name: Read upstream pin
        id: upstream
        run: |
          echo "repo=$(python3 -c 'import json;print(json.load(open("prismgram/upstream.json"))["repository"])')" >> "$GITHUB_OUTPUT"
          echo "commit=$(python3 -c 'import json;print(json.load(open("prismgram/upstream.json"))["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          df -h /
          # Other Xcode versions and SDKs we don't need take tens of GB.
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet /usr/local/lib/node_modules ~/.dotnet || true
          df -h /

      - name: Fetch Swiftgram sources
        run: |
          set -e
          sudo mkdir -p "$SRC_DIR"
          sudo chown "$(whoami)" "$SRC_DIR"
          cd "$SRC_DIR"
          git init -q
          git remote add origin "${{ steps.upstream.outputs.repo }}"
          git fetch -q --depth 1 origin "${{ steps.upstream.outputs.commit }}"
          git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1 --jobs 8 \
            || git submodule update --init --recursive --jobs 8
          git log -1 --format='Swiftgram %H (%ci) %s'

      - name: Apply PrismGram patches and branding
        run: python3 "$GITHUB_WORKSPACE/prismgram/apply_prismgram.py" "$SRC_DIR"

      - name: Select Xcode
        run: |
          set -e
          cd "$SRC_DIR"
          WANTED=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          echo "Swiftgram wants Xcode $WANTED"
          ls -d /Applications/Xcode*.app || true
          if [ -d "/Applications/Xcode_$WANTED.app" ]; then
            XCODE="/Applications/Xcode_$WANTED.app"
          else
            MAJOR="${WANTED%%.*}"
            XCODE=$(ls -d /Applications/Xcode_${MAJOR}*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          fi
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode $WANTED on this runner"
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          # Remove the other Xcodes to free disk space for the Bazel build.
          for x in /Applications/Xcode*.app; do
            if [ "$x" != "$XCODE" ] && [ ! -L "$x" ]; then sudo rm -rf "$x" & fi
          done
          wait
          # Some third-party build scripts (dav1d) hardcode /Applications/Xcode.app.
          sudo rm -rf /Applications/Xcode.app
          sudo ln -s "$XCODE" /Applications/Xcode.app
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          ls -la /Applications/Xcode.app
          ls /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/
          df -h /

      - name: Write build configuration
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          set -e
          cd "$SRC_DIR"
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::warning::TG_API_ID / TG_API_HASH secrets are not set. Using the default credentials from Swiftgram's appstore configuration. Get your own at https://my.telegram.org/apps and add them as repository secrets."
          fi
          python3 - <<'EOF'
          import json, os
          cfg = json.load(open("build-system/appstore-configuration.json"))
          # Bundle id and team must match build-system/fake-codesigning profiles.
          cfg["sg_config"] = ""
          app = json.load(open(os.path.join(os.environ["GITHUB_WORKSPACE"], "prismgram", "app.json")))
          cfg["bundle_id"] = app["bundle_id"]
          # Re-signing with a personal .p12 (Feather, ESign, Sideloadly) gives a profile
          # without iCloud / Siri. CloudKit then crashes the app at launch, so turn both off.
          cfg["enable_icloud"] = False
          cfg["enable_siri"] = False
          if os.environ.get("TG_API_ID") and os.environ.get("TG_API_HASH"):
              cfg["api_id"] = os.environ["TG_API_ID"]
              cfg["api_hash"] = os.environ["TG_API_HASH"]
          json.dump(cfg, open("build-system/prismgram-configuration.json", "w"), indent=2)
          print("bundle_id:", cfg["bundle_id"], "api_id set:", bool(cfg["api_id"]))
          EOF

      - name: Make signing profiles for the PrismGram bundle id
        run: |
          set -e
          BUNDLE_ID=$(python3 -c 'import json;print(json.load(open("prismgram/app.json"))["bundle_id"])')
          python3 prismgram/make_fake_profiles.py "$SRC_DIR" "$BUNDLE_ID"

      - name: Restore Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BAZEL_CACHE_DIR }}
          key: bazel-${{ steps.upstream.outputs.commit }}-${{ hashFiles('prismgram/patches/**') }}
          restore-keys: |
            bazel-${{ steps.upstream.outputs.commit }}-
            bazel-

      - name: Build PrismGram (release_arm64)
        id: build
        run: |
          set -e
          cd "$SRC_DIR"
          BUILD_NUMBER=$(( $(cat build_number_offset) + ${{ github.run_number }} ))
          echo "Build number $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')" >> "$GITHUB_ENV"
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir="$BAZEL_CACHE_DIR" \
            build \
            --continueOnError \
            --configurationPath=build-system/prismgram-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath="$SRC_DIR/build/artifacts"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/artifacts/Swiftgram.ipa "$GITHUB_WORKSPACE/out/PrismGram.ipa"
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Save Bazel cache
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BAZEL_CACHE_DIR }}
          key: bazel-${{ steps.upstream.outputs.commit }}-${{ hashFiles('prismgram/patches/**') }}-${{ github.run_id }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PrismGram-ipa
          path: out/PrismGram.ipa
          retention-days: 30

      - name: Make Feather / AltStore source
        run: |
          python3 - <<'EOF'
          import json, os, datetime
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = "build-" + os.environ["BUILD_NUMBER"]
          base = "https://github.com/%s/releases" % repo
          size = os.path.getsize("out/PrismGram.ipa")
          date = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          version = {
              "version": os.environ["APP_VERSION"],
              "buildVersion": os.environ["BUILD_NUMBER"],
              "date": date,
              "downloadURL": "%s/download/%s/PrismGram.ipa" % (base, tag),
              "size": size,
              "localizedDescription": "PrismGram build %s" % os.environ["BUILD_NUMBER"],
              "minOSVersion": "13.0",
          }
          source = {
              "name": "PrismGram",
              "identifier": "io.github.%s.prismgram" % repo.split("/")[0].lower(),
              "sourceURL": "%s/latest/download/source.json" % base,
              "iconURL": "%s/latest/download/icon.png" % base,
              "apps": [{
                  "name": "PrismGram",
                  "bundleIdentifier": json.load(open("prismgram/app.json"))["bundle_id"],
                  "developerName": repo.split("/")[0],
                  "subtitle": "Telegram with ghost mode and saved deleted messages",
                  "localizedDescription": "Swiftgram-based Telegram client with AyuGram-style features: ghost mode, saved deleted messages, edit history.",
                  "iconURL": "%s/latest/download/icon.png" % base,
                  "tintColor": "7B2FF7",
                  "version": version["version"],
                  "versionDate": date,
                  "downloadURL": version["downloadURL"],
                  "size": size,
                  "versions": [version],
              }],
              "news": [],
          }
          json.dump(source, open("out/source.json", "w"), indent=2)
          EOF
          cp prismgram/branding/icon.png out/icon.png

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          target_commitish: ${{ github.sha }}
          name: PrismGram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          make_latest: "true"
          body: |
            PrismGram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }}), branch `${{ github.ref_name }}`.

            Install with Feather / ESign / Sideloadly / AltStore (re-signs the IPA).
            Feather source: https://github.com/${{ github.repository }}/releases/latest/download/source.json
          files: |
            out/PrismGram.ipa
            out/source.json
            out/icon.png

  telegram:
    # Posts the IPA and the changelog to the Telegram channel once per new PrismGram version.
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || inputs.post_build) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: P
    permissions:
      contents: read
    steps:
      - name: Checkout PrismGram kit
        uses: actions/checkout@v4

      - name: Decide whether to post
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          BUILD_NUMBER: ${{ inputs.post_build || needs.build.outputs.build_number }}
          FORCE: ${{ inputs.post_build }}
        run: |
          set -e
          if [ -z "$BOT_TOKEN" ]; then
            echo "::notice::TG_BOT_TOKEN is not set, skipping the Telegram post."
            echo "post=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          VERSION=$(python3 -c 'import json;print(json.load(open("prismgram/app.json"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Post only the first build of each version.
          OLDER=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq "[.[] | select(.name | startswith(\"PrismGram $VERSION \")) | select(.tag_name != \"build-$BUILD_NUMBER\")] | length")
          if [ -n "$FORCE" ]; then
            echo "Manual post of build $BUILD_NUMBER."
            echo "post=true" >> "$GITHUB_OUTPUT"
          elif [ "$OLDER" != "0" ]; then
            echo "Version $VERSION was already posted, skipping."
            echo "post=false" >> "$GITHUB_OUTPUT"
          else
            echo "post=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the IPA
        if: steps.decide.outputs.post == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "build-${{ inputs.post_build || needs.build.outputs.build_number }}" -R "$GITHUB_REPOSITORY" -p PrismGram.ipa -D out
          ls -la out

      - name: Start a local Bot API server (uploads up to 2 GB)
        if: steps.decide.outputs.post == 'true'
        env:
          TELEGRAM_API_ID: ${{ secrets.TG_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          set -e
          docker run -d --name botapi -p 8081:8081 -e TELEGRAM_API_ID -e TELEGRAM_API_HASH -e TELEGRAM_LOCAL=1 -v "$PWD/out:/data/out" aiogram/telegram-bot-api:latest
          for i in $(seq 1 60); do
            if curl -s -o /dev/null "http://127.0.0.1:8081/"; then echo "Bot API is up"; exit 0; fi
            sleep 2
          done
          docker logs botapi; exit 1

      - name: Post to the channel
        if: steps.decide.outputs.post == 'true'
        env:
          BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          BUILD_NUMBER: ${{ inputs.post_build || needs.build.outputs.build_number }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, sys
          app = json.load(open("prismgram/app.json"))
          channel = app.get("channel", "@prismgram_ios")
          lines = ["<b>PrismGram {} ({})</b>".format(app["version"], os.environ["BUILD_NUMBER"])]
          changelog = app.get("changelog") or []
          if changelog:
              lines.append("")
              lines.append("Что нового:")
              lines += ["• " + item for item in changelog]
          lines.append("")
          lines.append("Установка: подпишите IPA через Feather / ESign / Sideloadly.")
          caption = "\n".join(lines)[:1024]
          url = "http://127.0.0.1:8081/bot{}/sendDocument".format(os.environ["BOT_TOKEN"])
          me = subprocess.run(["curl", "-sS", "--max-time", "60", "http://127.0.0.1:8081/bot{}/getMe".format(os.environ["BOT_TOKEN"])], capture_output=True, text=True)
          print("getMe:", me.returncode, me.stdout[:300], me.stderr[:300])
          result = subprocess.run([
              "curl", "-sS", "--max-time", "900", url,
              "-F", "chat_id=" + channel,
              "-F", "parse_mode=HTML",
              "-F", "caption=" + caption,
              "-F", "document=@out/PrismGram.ipa",
          ], capture_output=True, text=True)
          try:
              answer = json.loads(result.stdout or "{}")
          except ValueError:
              answer = {}
          if not answer.get("ok"):
              print("Telegram error: curl exit", result.returncode, "stdout:", result.stdout[:1000], "stderr:", result.stderr[:1000])
              print(subprocess.run(["docker", "logs", "--tail", "80", "botapi"], capture_output=True, text=True).stderr[-4000:])
              sys.exit(1)
          print("Posted to", channel)
          EOF

